<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Практикум к уроку 2 — матрица обучения</title>
  <style>
    :root{--navy:#173b5e;--blue:#237db5;--blue-soft:#e9f4fb;--orange:#f4862f;--green:#20895c;--green-soft:#e9f7f0;--red:#b84747;--red-soft:#fff0ef;--text:#25384a;--muted:#60778c;--line:#d3e0e9;--surface:#fff;--canvas:#edf5f9;--shadow:rgba(23,59,94,.14)}
    @media(prefers-color-scheme:dark){:root{--navy:#e7f2fb;--blue:#57b7ed;--blue-soft:#173a50;--orange:#ff9a4c;--green:#54c892;--green-soft:#173e31;--red:#ff8c8c;--red-soft:#4b2929;--text:#eaf3f9;--muted:#a9bfce;--line:#355367;--surface:#102838;--canvas:#091d29;--shadow:rgba(0,0,0,.28)}}
    *{box-sizing:border-box}html,body{margin:0;min-height:100%}body{display:grid;place-items:center;background:var(--canvas);font-family:Arial,Helvetica,sans-serif}button{font:inherit}
    #trainer{width:min(100%,500px);min-height:500px;height:auto;overflow:hidden;color:var(--text);background:var(--canvas);border:1px solid var(--line);border-radius:24px;box-shadow:0 16px 40px var(--shadow)}
    .top{height:58px;padding:13px 18px 10px;display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-bottom:1px solid var(--line)}.kicker{color:var(--blue);font-size:12px;font-weight:800;letter-spacing:.07em;text-transform:uppercase}.counter{min-width:70px;padding:6px 9px;color:var(--navy);background:var(--blue-soft);border:1px solid var(--line);border-radius:999px;text-align:center;font-size:12px;font-weight:800}
    .stage{min-height:442px;padding:15px 18px 14px;display:flex;flex-direction:column;background:radial-gradient(circle at 94% 0%,color-mix(in srgb,var(--blue) 15%,transparent) 0 70px,transparent 71px),var(--canvas)}.view{min-height:413px;display:flex;flex-direction:column;animation:enter .2s ease both}
    h1,h2,p{margin:0}h1{max-width:440px;color:var(--navy);font-size:27px;line-height:1.08;letter-spacing:-.025em}h2{color:var(--navy);font-size:20px;line-height:1.12;letter-spacing:-.015em}.lead{margin-top:12px;font-size:14px;line-height:1.42}
    .path{margin-top:18px;display:grid;grid-template-columns:repeat(5,1fr);gap:4px}.path span{padding:8px 2px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:center;font-size:9px;font-weight:700}.path b{display:block;margin-bottom:3px;color:var(--blue);font-size:15px}
    .primary,.secondary{min-height:40px;padding:8px 13px;border-radius:11px;cursor:pointer;font-weight:800}.primary{color:#fff;background:var(--blue);border:1px solid var(--blue);box-shadow:0 8px 18px color-mix(in srgb,var(--blue) 28%,transparent)}.secondary{color:var(--navy);background:var(--surface);border:1px solid var(--line)}.primary:hover,.secondary:hover{transform:translateY(-1px)}.start{width:100%;margin-top:auto}button:focus-visible{outline:3px solid color-mix(in srgb,var(--orange) 55%,transparent);outline-offset:2px}
    .case-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}.step-tag{flex:0 0 auto;padding:5px 8px;color:var(--blue);background:var(--blue-soft);border-radius:8px;font-size:11px;font-weight:800}.scene{max-height:88px;margin-top:8px;padding:9px 11px;overflow:auto;background:var(--surface);border-left:4px solid var(--orange);border-radius:0 11px 11px 0;font-size:12px;line-height:1.32;scrollbar-width:thin}
    .tracker{margin-top:8px;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}.tracker span{height:22px;display:grid;place-items:center;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:7px;font-size:8.5px;font-weight:700}.tracker span.done{color:var(--green);background:var(--green-soft)}
    .question{margin-top:9px;color:var(--navy);font-size:13.5px;line-height:1.22;font-weight:800}.options{margin-top:7px;display:grid;gap:5px}.option{width:100%;min-height:36px;padding:7px 10px;display:flex;align-items:center;gap:8px;color:var(--text);background:var(--surface);border:1px solid var(--line);border-radius:10px;text-align:left;font-size:11.7px;line-height:1.18;cursor:pointer}.option:hover{transform:translateX(2px);border-color:var(--blue)}.letter{flex:0 0 24px;height:24px;display:grid;place-items:center;color:var(--navy);background:var(--blue-soft);border-radius:7px;font-size:11px;font-weight:900}.option.wrong{color:var(--red);background:var(--red-soft);border-color:var(--red);animation:shake .2s ease}.option.correct{color:var(--green);background:var(--green-soft);border-color:var(--green)}
    .feedback{min-height:42px;margin-top:6px;padding:7px 9px;color:var(--muted);background:color-mix(in srgb,var(--surface) 78%,transparent);border:1px solid var(--line);border-radius:9px;font-size:10.8px;line-height:1.22}.feedback.good{color:var(--green)}.feedback.bad{color:var(--red)}.foot{margin-top:auto;padding-top:7px;display:flex;align-items:center;gap:9px}.progress{height:7px;flex:1;overflow:hidden;background:var(--line);border-radius:999px}.progress div{height:100%;background:linear-gradient(90deg,var(--blue),var(--green));border-radius:inherit;transition:width .25s ease}.next{min-width:128px;min-height:37px;padding:7px 11px}.next[hidden]{display:none}
    .score{display:flex;align-items:center;justify-content:space-between;padding:8px 10px;color:var(--navy);background:var(--green-soft);border:1px solid color-mix(in srgb,var(--green) 42%,var(--line));border-radius:11px;font-size:12px;font-weight:800}.score strong{color:var(--green);font-size:20px}.result-scroll{min-height:0;margin-top:7px;overflow:auto;scrollbar-width:thin}.result-card{margin-bottom:7px;padding:8px 9px;background:var(--surface);border:1px solid var(--line);border-radius:10px;font-size:10.5px;line-height:1.28}.result-card h3{margin:0 0 4px;color:var(--navy);font-size:12px}.result-card p{margin:2px 0}.result-card b{color:var(--muted)}.actions{margin-top:auto;padding-top:7px;display:grid;grid-template-columns:1fr 1fr;gap:7px}
    @keyframes enter{from{opacity:0;transform:translateY(5px)}to{opacity:1;transform:none}}@keyframes shake{35%{transform:translateX(-4px)}70%{transform:translateX(4px)}}@media(max-width:390px){#trainer{border-radius:18px}.stage{padding:13px 11px 11px}h1{font-size:24px}h2{font-size:18px}.option{font-size:11px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
  </style>
</head>
<body>
  <div id="trainer" role="region" aria-label="Тренажер по заполнению матрицы обучения"><header class="top"><div class="kicker">Практикум · матрица обучения</div><div class="counter" id="counter">3 ситуации</div></header><main class="stage" id="stage"></main></div>
  <script src="iframeResizer.contentWindow.js"></script>
  <script>
  (()=>{
    const stage=document.getElementById('stage'),counter=document.getElementById('counter'),letters=['А','Б','В'],labels=['Событие','Изменения','Мероприятия','Сроки и формат'];
    const cases=[
      {title:'Мария: новое название участка',scene:'С 15 сентября «цех упаковки» переименуют в «участок упаковки». Мария продолжит ту же работу на том же оборудовании. Условия труда, источники опасности, уровни профессиональных рисков и характер работы не изменятся. Мария прошла необходимое обучение. Сроки очередного обучения и повторного инструктажа еще не наступили.',result:{event:'Переименование подразделения',conditions:'Четыре характеристики сохранились',action:'Не проводить повторно вводный инструктаж, обучение и проверку знания только из-за переименования',date:'Сохранить действующие плановые сроки и формат'},steps:[
        ['Какое событие запускает проверку?',['Переименование подразделения','Перевод на другую работу','Первое трудоустройство'],0,'Верно. Пункт 7 прямо учитывает переименование подразделения.','Название изменилось, но кадрового перевода на другую работу нет.'],
        ['Что нужно сравнить перед решением?',['Только название должности','Условия труда, источники опасности, уровни профессиональных рисков и характер работы','Только дату прежнего протокола'],1,'Да. Все четыре характеристики сохранились.','Пункт 7 требует проверить четыре характеристики фактической работы.'],
        ['Что назначить Марии из-за переименования?',['Повторное обучение по программам Б и В','Ничего дополнительно: сохранить действующие мероприятия','Только повторную проверку знания'],1,'Точно. Само переименование не отменяет результаты пройденного обучения.','Если Мария прошла необходимое обучение и работа не изменилась, повтор не нужен.'],
        ['Как заполнить графы «Сроки» и «Формат»?',['Отсчитать 60 дней с 15 сентября','Сохранить прежние плановые сроки и формат','Назначить очное обучение в первый рабочий день'],1,'Матрица заполнена: лишнего обучения и новой даты нет.','Событие не потребовало нового мероприятия, поэтому действующие сроки и формат сохраняются.']]},
      {title:'Павел: перевод в окрасочную камеру',scene:'Павла переводят слесарем в окрасочную камеру. Появятся пары растворителей и фильтрующая полумаска, применение которой требует практических навыков. Работа не включена в перечень работ повышенной опасности. Павел — работник рабочей профессии.',result:{event:'Перевод на другую работу',conditions:'Изменились источники опасности и применяемые СИЗ',action:'Первичный инструктаж, обучение по программе Б, по оказанию первой помощи пострадавшим и по применению СИЗ; Программа В не нужна. Необходимость стажировки проверьте по утвержденному работодателем перечню профессий и должностей.',date:'Инструктаж — до самостоятельной работы; обучение — в срок работодателя, не позднее 60 дней; практические занятия по применению СИЗ — очно'},steps:[
        ['Какое событие укажите в матрице?',['Наступление срока планового обучения по программе В','Перевод на другую работу','Переименование участка'],1,'Верно. После перевода сравниваем фактические условия.','Павел начинает другую работу внутри организации.'],
        ['Можно ли оставить прежний перечень инструктажей и обучения?',['Да, потому что Павел остался слесарем','Нет: изменились источники опасности и применяемые СИЗ','Да, если действует прежний протокол по программе Б'],1,'Да. Исключение пункта 7 не работает.','Прежний протокол не учитывает автоматически новые источники опасности и СИЗ.'],
        ['Какие мероприятия нужны Павлу?',['Первичный инструктаж, обучение по программе Б, по оказанию первой помощи пострадавшим и по применению СИЗ','Обучение по программам А, Б и В и стажировка','Только инструктаж по применению СИЗ'],0,'Верно. В кейсе нет работ повышенной опасности, поэтому программа В и стажировка не нужны.','Определите мероприятия по профессии и фактическим опасностям, не добавляя программу В «на всякий случай».'],
        ['Как установить сроки и формат?',['Все обучение провести дистанционно в течение 60 дней','Первичный инструктаж — до самостоятельной работы; обучение — не позднее 60 дней; практические занятия по применению СИЗ — очно','Провести все обучение очно в учебном центре'],1,'Матрица заполнена. Теорию можно провести дистанционно, но практические занятия по применению СИЗ — только очно.','Разделите срок инструктажа, срок обучения и формат практических занятий.']]},
      {title:'Антон: первый год на работе повышенной опасности',scene:'Антон впервые поступил на работу и допущен к работе повышенной опасности. До допуска он прошел все обязательные мероприятия. Первичный инструктаж провели 6 сентября. Руководитель включил Антона в общий шестимесячный график.',result:{event:'Первое трудоустройство и допуск к работе повышенной опасности',conditions:'Впервые выполняет работу повышенной опасности',action:'Повторный инструктаж на рабочем месте не реже одного раза в три месяца в течение первого года',date:'Не допускать интервал более трех месяцев; при отсчете от 6 сентября — не позднее 6 декабря'},steps:[
        ['Какие два условия создают специальный срок?',['Первое трудоустройство и допуск к работе повышенной опасности','Перевод и новый СИЗ','Совместительство и новая должность'],0,'Верно. Для пункта 14 важны оба условия одновременно.','Антон впервые поступил на работу и допущен к работе повышенной опасности.'],
        ['Чего сейчас не хватает в плане?',['Повторного обучения по программе В каждые три месяца','Контрольной даты повторного инструктажа','Нового вводного инструктажа'],1,'Да. Обязательную подготовку до допуска Антон уже прошел.','Трехмесячное правило относится к инструктажу, а не к повторному обучению.'],
        ['Какая периодичность нужна в первый год?',['Не реже одного раза в три месяца','Один раз в шесть месяцев','Один раз в три года'],0,'Точно. Общий шестимесячный график здесь не подходит.','Для такого новичка пункт 14 устанавливает более частый повторный инструктаж.'],
        ['Как установить ближайший срок повторного инструктажа?',['Не допускать интервал более трех месяцев; при отсчете от 6 сентября — не позднее 6 декабря','Всегда назначать ровно 6 декабря независимо от документов','Отсчитать 60 дней после допуска'],0,'Матрица заполнена. Установите срок по документам работодателя и не допускайте интервал больше трех месяцев.','Порядок задает периодичность, поэтому установите контрольную дату и укажите, от какой даты ее отсчитали.']]}
    ];
    let ci=0,si=0,score=0,tried=false,done=cases.map(()=>Array(4).fill(false));
    function start(){counter.textContent='3 ситуации';stage.innerHTML=`<section class="view"><h1>Заполните матрицу для трех работников</h1><p class="lead">В уроке вы заполнили матрицу для Сергея. Теперь потренируйтесь на трех новых ситуациях: определите событие и изменения в работе, выберите обязательные мероприятия, установите сроки и формат. Не назначайте лишнее обучение, не пропускайте сроки и не заменяйте очную практику дистанционной.</p><div class="path">${['Событие','Изменения','Мероприятия','Сроки','Формат'].map((x,i)=>`<span><b>${i+1}</b>${x}</span>`).join('')}</div><button class="primary start" id="start">Начать практику</button></section>`;document.getElementById('start').onclick=()=>{ci=0;si=0;score=0;tried=false;done=cases.map(()=>Array(4).fill(false));render()}}
    function render(){const item=cases[ci],s=item.steps[si],progress=(ci*4+si)/12*100;counter.textContent=`${ci+1} из 3`;stage.innerHTML=`<section class="view"><div class="case-head"><h2>${item.title}</h2><span class="step-tag">Шаг ${si+1} из 4</span></div><div class="scene">${item.scene}</div><div class="tracker">${labels.map((x,i)=>`<span class="${done[ci][i]?'done':''}">${done[ci][i]?'✓ ':''}${x}</span>`).join('')}</div><p class="question">${s[0]}</p><div class="options">${s[1].map((x,i)=>`<button class="option" data-i="${i}"><span class="letter">${letters[i]}</span><span>${x}</span></button>`).join('')}</div><div class="feedback" id="feedback" role="status">Выберите вариант. После ошибки появится подсказка.</div><div class="foot"><div class="progress"><div style="width:${progress}%"></div></div><button class="primary next" id="next" hidden>${si===3?(ci===2?'Посмотреть результат':'Следующая ситуация'):'Следующий шаг'}</button></div></section>`;stage.querySelectorAll('.option').forEach(b=>b.onclick=()=>choose(b,+b.dataset.i))}
    function choose(button,i){const s=cases[ci].steps[si],fb=document.getElementById('feedback'),next=document.getElementById('next');stage.querySelectorAll('.option').forEach(x=>x.classList.remove('wrong'));if(i!==s[2]){tried=true;button.classList.add('wrong');fb.className='feedback bad';fb.textContent=`Пока нет. ${s[4]}`;return}if(!tried)score++;done[ci][si]=true;button.classList.add('correct');stage.querySelectorAll('.option').forEach(x=>x.disabled=true);fb.className='feedback good';fb.textContent=s[3];next.hidden=false;next.onclick=advance}
    function advance(){tried=false;if(si<3){si++;render()}else if(ci<2){ci++;si=0;render()}else result()}
    function result(){counter.textContent='Готово';stage.innerHTML=`<section class="view"><div class="score"><span>Верно с первой попытки</span><strong>${score}/12</strong></div><div class="result-scroll">${cases.map(x=>`<article class="result-card"><h3>${x.title}</h3><p><b>Событие:</b> ${x.result.event}</p><p><b>Изменения:</b> ${x.result.conditions}</p><p><b>Мероприятия:</b> ${x.result.action}</p><p><b>Сроки и формат:</b> ${x.result.date}</p></article>`).join('')}</div><div class="actions"><button class="secondary" id="again">Пройти еще раз</button></div></section>`;document.getElementById('again').onclick=start}
    start();
  })();
  </script>
</body>
</html>
